/* 같은 재료의 다른 표기 → 표준 키워드로 매핑. */
const ALIASES = {
  달걀: "계란", 깐마늘: "마늘", 다진마늘: "마늘", 양상추: "상추",
  소세지: "소시지", 청양고추: "고추", 풋고추: "고추", 홍고추: "고추", 알배추: "배추",
  닭가슴살: "닭고기", 닭다리: "닭고기", 닭날개: "닭고기", 닭봉: "닭고기", 닭안심: "닭고기", 통닭: "닭고기",
};
function canon(key) { return ALIASES[key] || key; }

const ALL_KEYS = [...Object.keys(SHELF_LIFE_DB), ...Object.keys(ALIASES)];
const SORTED_KEYS = ALL_KEYS.sort((a, b) => b.length - a.length);

const EXACT_SCAN_KEYS = SORTED_KEYS.filter((k) => k.length >= 2);
const SUFFIX_SCAN_KEYS = SORTED_KEYS.filter((k) => k.length === 1);
const FUZZY_SCAN_KEYS = SORTED_KEYS.filter((k) => k.length >= 3);

const TRAILING_UNITS = ["개", "구", "입", "팩", "봉", "단", "통", "망", "모", "줄", "포", "캔", "병", "갑", "원", "장", "매", "대", "알", "쪽", "톨", "조각"];
function stripTrailingUnits(s) {
  let result = s;
  let changed = true;
  while (changed) {
    changed = false;
    for (const u of TRAILING_UNITS) {
      if (result.length > u.length && result.endsWith(u)) {
        result = result.slice(0, -u.length);
        changed = true;
      }
    }
  }
  return result;
}

function levenshteinAtMost1(a, b) {
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1) return false;
  const la = a.length, lb = b.length;
  const dp = Array.from({ length: la + 1 }, () => new Array(lb + 1).fill(0));
  for (let i = 0; i <= la; i++) dp[i][0] = i;
  for (let j = 0; j <= lb; j++) dp[0][j] = j;
  for (let i = 1; i <= la; i++) {
    for (let j = 1; j <= lb; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
    }
  }
  return dp[la][lb] <= 1;
}

function matchShelfLife(rawName) {
  const name = (rawName || "").replace(/\s/g, "");
  for (const key of SORTED_KEYS) {
    if (name.includes(key)) {
      const ck = canon(key);
      return { days: SHELF_LIFE_DB[ck], matched: true, key: ck };
    }
  }
  return { days: 7, matched: false, key: null };
}
function matchEmoji(rawName) {
  const name = (rawName || "").replace(/\s/g, "");
  for (const key of SORTED_KEYS) {
    const ck = canon(key);
    if (name.includes(key) && EMOJI_MAP[ck]) return EMOJI_MAP[ck];
  }
  return "🥫";
}

function toISODate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function todayStr() { return toISODate(new Date()); }
function addDays(dateStr, days) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + days);
  return toISODate(d);
}
function daysBetween(dateStr) {
  const target = new Date(dateStr + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.round((target - today) / 86400000);
}
function formatShort(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return `${d.getMonth() + 1}월 ${d.getDate()}일`;
}
function getStatus(daysLeft) {
  if (daysLeft <= 0) return "expired";
  if (daysLeft <= 1) return "urgent";
  if (daysLeft <= 4) return "warning";
  return "fresh";
}
function statusLabel(status, daysLeft) {
  if (status === "expired") return daysLeft === 0 ? "오늘까지" : `기한 ${Math.abs(daysLeft)}일 지남`;
  return `D-${daysLeft}`;
}

/* 이미지 로드 & OCR 전처리 (인식률을 높이기 위한 그레이스케일+대비 보정)   */
/* ------------------------------------------------------------------ */
function loadImageEl(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("이미지를 불러오지 못했어요."));
    img.src = src;
  });
}
function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("파일을 읽지 못했어요."));
    reader.readAsDataURL(file);
  });
}
function toGrayscaleCanvas(img) {
  const targetLong = 1700;
  const longSide = Math.max(img.width, img.height);
  const scale = Math.min(2.4, Math.max(1, targetLong / longSide));
  const w = Math.round(img.width * scale);
  const h = Math.round(img.height * scale);
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0, w, h);
  const imageData = ctx.getImageData(0, 0, w, h);
  const d = imageData.data;
  for (let i = 0; i < d.length; i += 4) {
    const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    d[i] = d[i + 1] = d[i + 2] = g;
  }
  ctx.putImageData(imageData, 0, 0);
  return { canvas, w, h };
}

function localMeanData(grayCanvas, w, h) {
  const smallW = Math.max(6, Math.round(w / 24));
  const smallH = Math.max(6, Math.round(h / 24));
  const smallCanvas = document.createElement("canvas");
  smallCanvas.width = smallW;
  smallCanvas.height = smallH;
  smallCanvas.getContext("2d").drawImage(grayCanvas, 0, 0, smallW, smallH);
  const bigCanvas = document.createElement("canvas");
  bigCanvas.width = w;
  bigCanvas.height = h;
  const bctx = bigCanvas.getContext("2d");
  bctx.imageSmoothingEnabled = true;
  bctx.drawImage(smallCanvas, 0, 0, w, h);
  return bctx.getImageData(0, 0, w, h).data;
}

function buildOcrVariants(img) {
  const { canvas: grayCanvas, w, h } = toGrayscaleCanvas(img);
  const grayData = grayCanvas.getContext("2d").getImageData(0, 0, w, h).data;
  const localMean = localMeanData(grayCanvas, w, h);

  const contrastCanvas = document.createElement("canvas");
  contrastCanvas.width = w;
  contrastCanvas.height = h;
  const cctx = contrastCanvas.getContext("2d");
  const cData = cctx.createImageData(w, h);
  for (let i = 0; i < grayData.length; i += 4) {
    let v = 128 + (grayData[i] - localMean[i]) * 2.4;
    v = Math.max(0, Math.min(255, v));
    cData.data[i] = cData.data[i + 1] = cData.data[i + 2] = v;
    cData.data[i + 3] = 255;
  }
  cctx.putImageData(cData, 0, 0);

  const binCanvas = document.createElement("canvas");
  binCanvas.width = w;
  binCanvas.height = h;
  const bctx2 = binCanvas.getContext("2d");
  const bData = bctx2.createImageData(w, h);
  for (let i = 0; i < grayData.length; i += 4) {
    const v = grayData[i] < localMean[i] - 14 ? 0 : 255;
    bData.data[i] = bData.data[i + 1] = bData.data[i + 2] = v;
    bData.data[i + 3] = 255;
  }
  bctx2.putImageData(bData, 0, 0);

  return { contrastCanvas, binCanvas };
}

/* ------------------------------------------------------------------ */
/* 브라우저 내장 OCR (Tesseract.js) — 외부 서버 호출 없음, API 키 불필요. */
/* ------------------------------------------------------------------ */
async function runOcrMultiPass(img, onProgress) {
  const { contrastCanvas, binCanvas } = buildOcrVariants(img);
  let passIndex = 0;
  const worker = await Tesseract.createWorker("kor", 1, {
    logger: (m) => {
      if (onProgress && m.status === "recognizing text" && typeof m.progress === "number") {
        onProgress(Math.min(99, Math.round(((passIndex + m.progress) / 2) * 100)));
      }
    },
  });
  try {
    await worker.setParameters({ tessedit_pageseg_mode: "4" });
    const pass1 = await worker.recognize(contrastCanvas);
    passIndex = 1;
    await worker.setParameters({ tessedit_pageseg_mode: "11" });
    const pass2 = await worker.recognize(binCanvas);
    return (pass1.data.text || "") + "\n" + (pass2.data.text || "");
  } finally {
    await worker.terminate();
  }
}

function isLikelyNoiseLine(cleaned) {
  if (cleaned.length < 8) return false;
  const uniqueCount = new Set(cleaned).size;
  return uniqueCount / cleaned.length < 0.6;
}

function extractFoodKeywordsFromText(rawText) {
  const lines = rawText.split(/\r?\n/);
  const seen = new Set();
  const found = [];
  const add = (key) => {
    const ck = canon(key);
    if (!seen.has(ck)) {
      seen.add(ck);
      found.push(ck);
    }
  };
  for (const line of lines) {
    const cleaned = line.replace(/[^가-힣]/g, "");
    if (!cleaned || isLikelyNoiseLine(cleaned)) continue;

    for (const key of EXACT_SCAN_KEYS) {
      if (cleaned.includes(key)) add(key);
    }

    if (!/[0-9]/.test(line)) continue;
    const stripped = stripTrailingUnits(cleaned);
    if (stripped) {
      for (const key of SUFFIX_SCAN_KEYS) {
        if (stripped.endsWith(key)) add(key);
      }
      for (const key of FUZZY_SCAN_KEYS) {
        if (levenshteinAtMost1(stripped, key)) add(key);
      }
    }
  }
  return found;
}

/* ------------------------------------------------------------------ */
function FreshnessRing({ percent, status, emoji, size = 56 }) {
  const strokeWidth = 4.5;
  const radius = (size - strokeWidth) / 2;
  const circumference = 2 * Math.PI * radius;
  const clamped = Math.max(0, Math.min(1, percent));
  const offset = circumference * (1 - clamped);
  const color = status === "fresh" ? "var(--fresh)" : status === "warning" ? "var(--warn)" : "var(--urgent)";
  return (
    <div className="ring-wrap" style={{ width: size, height: size }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke="rgba(255,255,255,0.09)" strokeWidth={strokeWidth} />
        <circle
          cx={size / 2} cy={size / 2} r={radius} fill="none" stroke={color} strokeWidth={strokeWidth}
          strokeDasharray={circumference} strokeDashoffset={offset} strokeLinecap="round"
          transform={`rotate(-90 ${size / 2} ${size / 2})`} className="ring-arc"
        />
      </svg>
      <span className="ring-emoji" style={{ fontSize: size * 0.42 }}>{emoji}</span>
    </div>
  );
}

function ItemCard({ item, onConsume, onDelete, onEditDate }) {
  const daysLeft = daysBetween(item.expiryDate);
  const status = getStatus(daysLeft);
  const percent = item.totalDays > 0 ? daysLeft / item.totalDays : 0;
  const [editing, setEditing] = useState(false);

  return (
    <div className={`item-card status-${status}`}>
      <FreshnessRing percent={percent} status={status} emoji={item.emoji} />
      <div className="item-body">
        <div className="item-top">
          <span className="item-name">{item.name}</span>
          <span className={`item-badge badge-${status}`}>{statusLabel(status, daysLeft)}</span>
        </div>
        <div className="item-meta">
          {editing ? (
            <input
              type="date" className="date-input-inline" defaultValue={item.expiryDate} autoFocus
              onBlur={(e) => { onEditDate(item.id, e.target.value); setEditing(false); }}
              onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }}
            />
          ) : (
            <button className="meta-edit-btn" onClick={() => setEditing(true)}>
              <span>{formatShort(item.expiryDate)}까지</span>
              <Pencil size={12} />
            </button>
          )}
          {!item.matched && <span className="unmatched-tag">추정치 확인 필요</span>}
        </div>
      </div>
      <div className="item-actions">
        <button className="icon-btn consume-btn" title="다 먹었어요" onClick={() => onConsume(item.id)}>
          <CheckCircle2 size={18} />
        </button>
        <button className="icon-btn delete-btn" title="삭제" onClick={() => onDelete(item.id)}>
          <Trash2 size={16} />
        </button>
      </div>
    </div>
  );
}

  const [ocrProgress, setOcrProgress] = useState(0);
  const [ocrError, setOcrError] = useState("");
  const [selectedFile, setSelectedFile] = useState(null); // { previewUrl }
  const [pendingItems, setPendingItems] = useState([]);
  const fileInputRef = useRef(null);

  const [manualName, setManualName] = useState("");
  const [manualDays, setManualDays] = useState("");

  useEffect(() => {
    try { localStorage.setItem(ITEMS_KEY, JSON.stringify(items)); } catch {}
  }, [items]);

  function resetScan() {
    setOcrStatus("idle");
    setOcrProgress(0);
    setOcrError("");
    setSelectedFile(null);
    if (fileInputRef.current) fileInputRef.current.value = "";
  }

  async function handleFileChosen(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const dataUrl = await readFileAsDataURL(file);
      setSelectedFile({ previewUrl: dataUrl });
      setOcrStatus("idle");
      setOcrError("");
    } catch (err) {
      setOcrError(err.message || "이미지를 처리하지 못했어요.");
      setOcrStatus("error");
    }
  }

  async function handleAnalyze() {
    if (!selectedFile) return;
    setOcrStatus("loading");
    setOcrProgress(0);
    setOcrError("");
    try {
      const img = await loadImageEl(selectedFile.previewUrl);
      const rawText = await runOcrMultiPass(img, (p) => setOcrProgress(p));
      const keys = extractFoodKeywordsFromText(rawText);
      if (keys.length === 0) {
        setOcrError("이미지에서 식재료를 찾지 못했어요. 더 선명한 사진으로 다시 시도해보세요.");
        setOcrStatus("error");
        return;
      }
      const today = todayStr();
      const built = keys.map((key) => ({
        id: uid(), name: key, emoji: EMOJI_MAP[key] || "🥫",
        addedDate: today, expiryDate: addDays(today, SHELF_LIFE_DB[key]),
        totalDays: SHELF_LIFE_DB[key], matched: true, dbKey: key,
      }));
      setPendingItems(built);
      setView("confirm");
      resetScan();
    } catch (err) {
      setOcrError(err.message || "인식 중 문제가 발생했어요. 다시 시도해주세요.");
      setOcrStatus("error");
    }
  }

  function updatePendingDate(id, newDate) {
    setPendingItems((prev) => prev.map((it) => (it.id === id ? { ...it, expiryDate: newDate, totalDays: Math.max(1, daysBetween(newDate)) } : it)));
  }
  function removePendingItem(id) {
    setPendingItems((prev) => prev.filter((it) => it.id !== id));
  }
  function confirmAddAll() {
    setItems((prev) => [...prev, ...pendingItems]);
    setPendingItems([]);
    setView("home");
  }
  function consumeItem(id) { setItems((prev) => prev.filter((it) => it.id !== id)); }
  function deleteItem(id) { setItems((prev) => prev.filter((it) => it.id !== id)); }
  function editItemDate(id, newDate) {
    setItems((prev) => prev.map((it) => (it.id === id ? { ...it, expiryDate: newDate } : it)));
  }

  function submitManual(e) {
    e.preventDefault();
    const name = manualName.trim();
    if (!name) return;
    const guess = matchShelfLife(name);
    const days = manualDays ? Math.max(1, parseInt(manualDays, 10) || guess.days) : guess.days;
    const today = todayStr();
    const newItem = {
      id: uid(), name, emoji: matchEmoji(name), addedDate: today,
      expiryDate: addDays(today, days), totalDays: days, matched: guess.matched,
      dbKey: guess.matched ? guess.key : null,
    };
    setItems((prev) => [...prev, newItem]);
    setManualName("");
    setManualDays("");
    setView("home");
  }

  const sortedItems = [...items].sort((a, b) => daysBetween(a.expiryDate) - daysBetween(b.expiryDate));
  const urgentCount = items.filter((it) => daysBetween(it.expiryDate) <= 1).length;

  return (
    <div className="page">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
        :root{
          --bg:#0E1E19; --bg-2:#0A1712; --surface:#17291F; --surface-2:#1E3327;
          --line: rgba(255,255,255,0.08); --text:#ECF3EC; --text-muted:#93A99B;
          --fresh:#6FCF7A; --warn:#F0AD3E; --urgent:#E86A4D; --brand:#7FDB8F;
        }
        *{ box-sizing:border-box; }
        body{ margin:0; }
        .page{
          min-height:100vh; background: radial-gradient(120% 140% at 15% 0%, #14281F 0%, var(--bg-2) 55%, #070F0C 100%);
          font-family:'Inter', system-ui, sans-serif; color:var(--text);
          display:flex; justify-content:center; padding:28px 16px 60px;
        }
        .app-shell{
          width:100%; max-width:430px; background:var(--bg); border:1px solid var(--line);
          border-radius:28px; box-shadow: 0 30px 80px -30px rgba(0,0,0,0.7); overflow:hidden;
          animation: rise .5s ease both;
        }
        @keyframes rise{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
        .header{ padding:24px 22px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
        .brand{ display:flex; align-items:center; gap:9px; }
        .brand-mark{ width:34px; height:34px; border-radius:10px; background: linear-gradient(155deg, var(--brand), #3E9A57); display:flex; align-items:center; justify-content:center; color:#0A1712; }
        .brand-text h1{ font-family:'Space Grotesk', sans-serif; font-size:18px; font-weight:700; margin:0; letter-spacing:-0.01em; }
        .brand-text p{ margin:1px 0 0; font-size:11.5px; color:var(--text-muted); }
        .back-btn{ background:none; border:none; color:var(--text-muted); cursor:pointer; display:flex; align-items:center; gap:6px; font-size:13px; padding:6px; border-radius:8px; }
        .back-btn:hover{ color:var(--text); background:var(--surface); }
        .privacy-badge{ font-size:10.5px; color:var(--text-muted); background:var(--surface); border:1px solid var(--line); padding:5px 9px; border-radius:999px; white-space:nowrap; flex-shrink:0; }
        .stats-row{ display:flex; gap:10px; padding:16px 22px 4px; }
        .stat-chip{ flex:1; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
        .stat-chip .num{ font-family:'IBM Plex Mono', monospace; font-size:20px; font-weight:600; }
        .stat-chip .lbl{ font-size:11px; color:var(--text-muted); margin-top:2px; }
        .stat-chip.warn .num{ color:var(--urgent); }
        .list{ padding:14px 16px 8px; display:flex; flex-direction:column; gap:10px; }
        .item-card{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:10px 12px; animation: fadein .35s ease both; }
        @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
        .ring-wrap{ position:relative; flex-shrink:0; }
        .ring-emoji{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
        .ring-arc{ transition: stroke-dashoffset .6s ease; }
        .item-body{ flex:1; min-width:0; }
        .item-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
        .item-name{ font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .item-badge{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:999px; white-space:nowrap; flex-shrink:0; }
        .badge-fresh{ background:rgba(111,207,122,0.15); color:var(--fresh); }
        .badge-warning{ background:rgba(240,173,62,0.16); color:var(--warn); }
        .badge-urgent{ background:rgba(232,106,77,0.18); color:var(--urgent); }
        .badge-expired{ background:rgba(232,106,77,0.22); color:var(--urgent); }
        .item-meta{ display:flex; align-items:center; gap:8px; margin-top:4px; }
        .meta-edit-btn{ background:none; border:none; color:var(--text-muted); font-size:11.5px; display:flex; align-items:center; gap:4px; cursor:pointer; padding:2px 0; font-family:inherit; }
        .meta-edit-btn:hover{ color:var(--text); }
        .unmatched-tag{ font-size:10.5px; color:var(--warn); background:rgba(240,173,62,0.12); padding:1px 7px; border-radius:999px; }
        .date-input-inline{ background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-size:11.5px; border-radius:7px; padding:2px 6px; }
        .item-actions{ display:flex; flex-direction:column; gap:6px; }
        .icon-btn{ border:none; background:var(--surface-2); color:var(--text-muted); width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition: transform .15s ease, color .15s ease, background .15s ease; }
        .icon-btn:hover{ transform:translateY(-1px); }
        .consume-btn:hover{ color:var(--fresh); background:rgba(111,207,122,0.14); }
        .delete-btn:hover{ color:var(--urgent); background:rgba(232,106,77,0.14); }
        .empty-state{ margin:6px 20px 6px; padding:32px 20px; text-align:center; border:1.5px dashed var(--line); border-radius:20px; }
        .empty-state .emoji{ font-size:34px; }
        .empty-state h3{ font-family:'Space Grotesk', sans-serif; font-size:16px; margin:10px 0 4px; }
        .empty-state p{ font-size:13px; color:var(--text-muted); margin:0 0 4px; line-height:1.5; }
        .fab-row{ display:flex; gap:10px; padding:16px 16px 20px; }
        .fab{ flex:1; display:flex; align-items:center; justify-content:center; gap:8px; padding:13px 14px; border-radius:14px; font-weight:600; font-size:13.5px; cursor:pointer; border:none; transition: filter .15s ease, transform .15s ease; font-family:inherit; }
        .fab:hover{ transform:translateY(-1px); }
        .fab-primary{ background: linear-gradient(155deg, var(--brand), #3E9A57); color:#0A1712; }
        .fab-secondary{ background:var(--surface); color:var(--text); border:1px solid var(--line); }
        .content{ padding:18px 20px 26px; }
        .section-title{ font-family:'Space Grotesk', sans-serif; font-size:17px; margin:0 0 4px; }
        .section-sub{ font-size:12.5px; color:var(--text-muted); line-height:1.55; margin:0 0 18px; }
        .upload-box{ border:1.5px dashed var(--line); border-radius:18px; padding:34px 18px; text-align:center; cursor:pointer; transition:border-color .15s ease, background .15s ease; display:block; }
        .upload-box:hover{ border-color: var(--brand); background:var(--surface); }
        .upload-box .icon-circle{ width:52px; height:52px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; color:var(--brand); }
        .upload-box p.title{ font-weight:600; font-size:14px; margin:0 0 4px; }
        .upload-box p.hint{ font-size:12px; color:var(--text-muted); margin:0; }
        .preview-wrap{ position:relative; border-radius:16px; overflow:hidden; border:1px solid var(--line); }
        .preview-wrap img{ width:100%; display:block; max-height:280px; object-fit:cover; }
        .preview-remove{ position:absolute; top:8px; right:8px; background:rgba(10,20,15,0.7); border:none; color:#fff; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; backdrop-filter: blur(4px); }
        .primary-btn{ width:100%; margin-top:16px; padding:14px; border:none; border-radius:14px; background: linear-gradient(155deg, var(--brand), #3E9A57); color:#0A1712; font-weight:700; font-size:14.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; font-family:inherit; }
        .primary-btn:disabled{ opacity:0.5; cursor:not-allowed; }
        .ghost-btn{ width:100%; margin-top:10px; padding:12px; border-radius:14px; border:1px solid var(--line); background:transparent; color:var(--text-muted); font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px; font-family:inherit; }
        .status-line{ display:flex; align-items:center; gap:8px; font-size:13px; margin-top:14px; padding:12px 14px; border-radius:12px; }
        .status-line.loading{ background:var(--surface); color:var(--text-muted); }
        .status-line.err{ background:rgba(232,106,77,0.12); color:var(--urgent); }
        .spin{ animation: spin 0.9s linear infinite; }
        @keyframes spin{ to{ transform:rotate(360deg); } }
        .confirm-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:6px; }
        .confirm-item{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 12px; }
        .confirm-emoji{ font-size:22px; width:30px; text-align:center; }
        .confirm-info{ flex:1; min-width:0; }
        .confirm-name{ font-weight:600; font-size:13.5px; }
        .confirm-sub{ font-size:11px; color:var(--text-muted); margin-top:2px; display:flex; align-items:center; gap:6px; }
        .confirm-date{ background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-size:12px; border-radius:8px; padding:5px 7px; font-family:'IBM Plex Mono', monospace; }
        .confirm-remove{ border:none; background:none; color:var(--text-muted); cursor:pointer; padding:6px; }
        .confirm-remove:hover{ color:var(--urgent); }
        .field{ margin-bottom:14px; }
        .field label{ display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:6px; }
        .field input, .field select{ width:100%; padding:11px 13px; border-radius:11px; border:1px solid var(--line); background:var(--surface); color:var(--text); font-size:14px; font-family:inherit; }
        .field input:focus, .field select:focus, button:focus-visible, .upload-box:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
        .hint-text{ font-size:11.5px; color:var(--text-muted); margin-top:5px; }
        @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
      `}</style>

      <div className="app-shell">
        <div className="header">
          <div className="brand">
            <div className="brand-mark"><Sparkles size={17} /></div>
            <div className="brand-text">
              <h1>신선해</h1>
              <p>사진 한 장으로 끝나는 냉장고 관리</p>
            </div>
          </div>
          {view === "home" ? (
            <span className="privacy-badge">🔒 무료 · 로컬 OCR</span>
          ) : (
            <button className="back-btn" onClick={() => { setView("home"); resetScan(); }}>
              <ArrowLeft size={15} /> 홈
            </button>
          )}
        </div>

        {view === "home" && (
          <>
            {items.length > 0 && (
              <div className="stats-row">
                <div className="stat-chip">
                  <div className="num">{items.length}</div>
                  <div className="lbl">보관 중인 재료</div>
                </div>
                <div className={`stat-chip ${urgentCount > 0 ? "warn" : ""}`}>
                  <div className="num">{urgentCount}</div>
                  <div className="lbl">곧 상하는 재료</div>
                </div>
              </div>
            )}

            {items.length === 0 ? (
              <div className="empty-state">
                <div className="emoji">🧊</div>
                <h3>냉장고가 비어있어요</h3>
                <p>영수증이나 쿠팡·컬리 주문내역 캡처를 올리면<br />재료를 자동으로 인식하고 예상 소비기한까지 계산해드려요.</p>
              </div>
            ) : (
              <div className="list">
                {sortedItems.map((item) => (
                  <ItemCard key={item.id} item={item} onConsume={consumeItem} onDelete={deleteItem} onEditDate={editItemDate} />
                ))}
              </div>
            )}

            <div className="fab-row">
              <button className="fab fab-primary" onClick={() => setView("scan")}>
                <Camera size={16} /> 사진으로 추가
              </button>
              <button className="fab fab-secondary" onClick={() => setView("manual")}>
                <Plus size={16} /> 직접 추가
              </button>
            </div>
          </>
        )}

        {view === "scan" && (
          <div className="content">
            <h2 className="section-title">영수증 · 주문내역으로 추가</h2>
            <p className="section-sub">
              마트 영수증이든 쿠팡·컬리·네이버 주문내역 캡처든 상관없어요. 브라우저 안에서 바로 글자를 읽어서
              식재료별 평균 소비기한으로 예상 날짜를 계산해요. 이미지는 어디로도 전송되지 않아요.
            </p>

            {!selectedFile ? (
              <label className="upload-box" htmlFor="receipt-input">
                <div className="icon-circle"><ImagePlus size={22} /></div>
                <p className="title">영수증 사진이나 캡처를 선택하세요</p>
                <p className="hint">영수증 촬영 · 쿠팡/컬리 주문내역 스크린샷 모두 가능</p>
                <input ref={fileInputRef} id="receipt-input" type="file" accept="image/*" style={{ display: "none" }} onChange={handleFileChosen} />
              </label>
            ) : (
              <div className="preview-wrap">
                <img src={selectedFile.previewUrl} alt="선택한 이미지 미리보기" />
                <button className="preview-remove" onClick={resetScan}><XIcon size={15} /></button>
              </div>
            )}

            {!selectedFile && (
              <p className="hint-text" style={{ marginTop: 10 }}>
                📸 밝은 곳에서 반듯하게, 화면 전체가 잘 보이도록 찍으면 인식률이 크게 좋아져요.
              </p>
            )}

            {selectedFile && ocrStatus !== "loading" && (
              <button className="primary-btn" onClick={handleAnalyze}>
                <Sparkles size={16} /> 재료 인식하기
              </button>
            )}

            {ocrStatus === "loading" && (
              <>
                <div className="status-line loading">
                  <Loader2 size={16} className="spin" /> 이미지를 읽는 중이에요... {ocrProgress}%
                </div>
                <p className="hint-text">인식률을 높이려고 두 가지 방식으로 분석해요. 처음 실행할 땐 엔진을 내려받느라 조금 더 걸려요.</p>
              </>
            )}
            {ocrStatus === "error" && (
              <>
                <div className="status-line err"><AlertTriangle size={16} /> {ocrError}</div>
                <button className="ghost-btn" onClick={resetScan}><RotateCcw size={14} /> 다시 시도</button>
              </>
            )}
          </div>
        )}

        {view === "confirm" && (
          <div className="content">
            <h2 className="section-title">인식된 재료 확인</h2>
            <p className="section-sub">평균 소비기한으로 예상 날짜를 계산했어요. 포장지 표기와 다르면 날짜를 눌러 수정하세요.</p>

            {pendingItems.length === 0 ? (
              <p className="hint-text">추가할 재료가 없어요.</p>
            ) : (
              <div className="confirm-list">
                {pendingItems.map((item) => (
                  <div className="confirm-item" key={item.id}>
                    <span className="confirm-emoji">{item.emoji}</span>
                    <div className="confirm-info">
                      <div className="confirm-name">{item.name}</div>
                      <div className="confirm-sub">자동 추정 · {item.totalDays}일</div>
                    </div>
                    <input type="date" className="confirm-date" value={item.expiryDate}
                      onChange={(e) => updatePendingDate(item.id, e.target.value)} />
                    <button className="confirm-remove" onClick={() => removePendingItem(item.id)}><XIcon size={15} /></button>
                  </div>
                ))}
              </div>
            )}

            <button className="primary-btn" disabled={pendingItems.length === 0} onClick={confirmAddAll}>
              <CheckCircle2 size={16} /> 냉장고에 담기 ({pendingItems.length}개)
            </button>
          </div>
        )}

        {view === "manual" && (
          <div className="content">
            <h2 className="section-title">직접 추가</h2>
            <p className="section-sub">재료 이름을 적으면 평균 소비기한을 자동으로 추천해드려요.</p>
            <form onSubmit={submitManual}>
              <div className="field">
                <label htmlFor="manual-name">재료 이름</label>
                <input id="manual-name" list="food-suggestions" placeholder="예: 방울토마토"
                  value={manualName} onChange={(e) => setManualName(e.target.value)} required />
                <datalist id="food-suggestions">
                  {Object.keys(SHELF_LIFE_DB).map((k) => <option key={k} value={k} />)}
                </datalist>
                {manualName.trim() && (
                  <p className="hint-text">
                    {matchShelfLife(manualName).matched
                      ? `자동 추정 소비기한: ${matchShelfLife(manualName).days}일`
                      : "일치하는 항목이 없어요. 기본값 7일이 적용돼요."}
                  </p>
                )}
              </div>
              <div className="field">
                <label htmlFor="manual-days">예상 소비기한 (일) — 선택 입력</label>
                <input id="manual-days" type="number" min="1"
                  placeholder={String(matchShelfLife(manualName).days || 7)}
                  value={manualDays} onChange={(e) => setManualDays(e.target.value)} />
              </div>
              <button className="primary-btn" type="submit"><Plus size={16} /> 냉장고에 추가</button>
            </form>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
